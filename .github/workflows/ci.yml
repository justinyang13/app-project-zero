name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22.x"

jobs:
  hub-build-test:
    name: Hub build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app-project-zero-hub/package-lock.json

      - name: Install dependencies
        working-directory: app-project-zero-hub
        run: npm ci

      - name: Lint
        working-directory: app-project-zero-hub
        run: npm run lint

      - name: Unit test
        working-directory: app-project-zero-hub
        run: npm test

      - name: Build
        working-directory: app-project-zero-hub
        run: npm run build

  hello-world-backend-build-test:
    name: Hello World backend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        working-directory: app-hello-world/server
        run: dotnet restore

      - name: Build
        working-directory: app-hello-world/server
        run: dotnet build --no-restore --configuration Release

      - name: Test
        working-directory: app-hello-world/server
        run: dotnet test --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hello-world-backend-test-results
          path: app-hello-world/server/tests/**/TestResults/**/*.trx

  hello-world-frontend-build-test:
    name: Hello World frontend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app-hello-world/client/package-lock.json

      - name: Install dependencies
        working-directory: app-hello-world/client
        run: npm ci

      - name: Lint
        working-directory: app-hello-world/client
        run: npm run lint

      - name: Unit test
        working-directory: app-hello-world/client
        run: npm test

      - name: Build
        working-directory: app-hello-world/client
        run: npm run build

  hello-world-e2e:
    name: Hello World end-to-end tests
    needs: [hello-world-backend-build-test, hello-world-frontend-build-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install client dependencies
        working-directory: app-hello-world/client
        run: npm ci

      - name: Install e2e dependencies
        working-directory: app-hello-world/e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: app-hello-world/e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e suite
        working-directory: app-hello-world/e2e
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hello-world-playwright-report
          path: app-hello-world/e2e/playwright-report/
          retention-days: 14
