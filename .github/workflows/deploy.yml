name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-pages:
    name: Deploy hub + apps to GitHub Pages
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: |
            app-project-zero-hub/package-lock.json
            app-hello-world/client/package-lock.json

      - name: Install and build hub
        working-directory: app-project-zero-hub
        run: |
          npm ci
          npm run build

      - name: Install and build Hello World client
        working-directory: app-hello-world/client
        # VITE_GRAPHQL_URL is baked in at build time — set the RENDER_API_URL
        # repository variable (Settings > Secrets and variables > Actions >
        # Variables) to the deployed Render API's https URL + /graphql.
        run: |
          npm ci
          npm run build
        env:
          VITE_GRAPHQL_URL: ${{ vars.RENDER_API_URL }}

      # Each app is a standalone project that only knows how to build
      # itself — this step is what actually composes them into one site,
      # with the hub at the root linking out to each app's subpath.
      - name: Assemble combined site
        run: |
          mkdir -p site
          cp -r app-project-zero-hub/dist/. site/
          mkdir -p site/app-hello-world
          cp -r app-hello-world/client/dist/. site/app-hello-world/
          mkdir -p site/app-note-ninja
          cp app-note-ninja/index.html app-note-ninja/game.js app-note-ninja/style.css site/app-note-ninja/
          mkdir -p site/app-pool-party-forecast
          cp app-pool-party-forecast/index.html site/app-pool-party-forecast/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-render:
    name: Deploy Hello World Api to Render
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        # The Render web service has its own GitHub integration with
        # autoDeploy enabled, so it already redeploys on every push to
        # main independently of this workflow. RENDER_DEPLOY_HOOK_URL is
        # only needed as a fallback if autoDeploy is ever turned off for
        # that service (Render dashboard → Settings → Auto-Deploy) —
        # in that case, set the secret and this step will trigger it.
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set — skipping. Render's own auto-deploy handles this unless it has been disabled."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
