  <polygon points="18,70 100,102 100,172 18,140" fill="#2f5fa0" stroke="#0d2438" stroke-width="5" stroke-linejoin="round"/>
  <rect x="34" y="118" width="30" height="10" fill="#8a97a8"/>
  <rect x="40" y="128" width="8" height="10" fill="#8a97a8"/>
  <rect x="54" y="128" width="8" height="10" fill="#8a97a8"/>
  <text x="59" y="98" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="30" fill="#ffffff">Sim</text>

  <!-- right face: "Craft" -->
  <polygon points="100,102 182,70 182,140 100,172" fill="#3fae4a" stroke="#0d2438" stroke-width="5" stroke-linejoin="round"/>
  <rect x="118" y="112" width="10" height="10" fill="#2f8a3a"/>
  <rect x="140" y="120" width="10" height="10" fill="#2f8a3a"/>
  <rect x="160" y="108" width="10" height="10" fill="#2f8a3a"/>
  <rect x="130" y="140" width="10" height="10" fill="#2f8a3a"/>
  <text x="141" y="95" text-anchor="middle" font-family="'Courier New', monospace" font-weight="bold" font-size="24" fill="#ffffff">Craft</text>
</svg>
