<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7fd4f5"/>
      <stop offset="100%" stop-color="#4fb8ea"/>
    </linearGradient>
  </defs>

  <!-- top face: sky -->
  <polygon points="100,38 182,70 100,102 18,70" fill="url(#sky)" stroke="#0d2438" stroke-width="5" stroke-linejoin="round"/>

